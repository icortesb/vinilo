name: vinilo
description: Tus reproducciones recientes de Spotify como un SVG estático en tu README
author: Iván Cortés

branding:
  icon: disc
  color: green

inputs:
  client-id:
    description: Client ID de tu app de Spotify
    required: true
  client-secret:
    description: Client secret de tu app de Spotify
    required: true
  refresh-token:
    description: Refresh token con el scope user-read-recently-played
    required: true
  count:
    description: Cuántos tracks mostrar (1-10)
    required: false
    default: "5"
  theme:
    description: both, dark o light. Con "both" salen dos archivos para usar con <picture>
    required: false
    default: both
  lang:
    description: Locale para los tiempos relativos (en, es, o cualquiera que entienda Intl)
    required: false
    default: en
  output-dir:
    description: Dónde escribir los SVG dentro del workspace
    required: false
    default: .vinilo
  filename:
    description: Nombre base de los archivos, sin extensión
    required: false
    default: vinilo
  publish-to:
    description: >-
      Rama donde commitear los SVG. Vacío deja los archivos escritos y no
      commitea nada. Los archivos que ya estén en esa rama se preservan.
    required: false
    default: ""

outputs:
  paths:
    description: Archivos generados, separados por coma
  track-count:
    description: Cuántos tracks entraron en la card

runs:
  using: node24
  main: dist/index.mjs
