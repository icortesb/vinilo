name: vinilo readme card
description: Your recently played Spotify tracks as a static SVG in your README
author: Iván Cortés

branding:
  icon: disc
  color: green

inputs:
  client-id:
    description: Client ID of your Spotify app
    required: true
  client-secret:
    description: Client secret of your Spotify app
    required: true
  refresh-token:
    description: Refresh token with the user-read-recently-played scope
    required: true
  count:
    description: How many tracks to show (1-10)
    required: false
    default: "5"
  theme:
    description: both, dark or light. "both" writes two files, for use with <picture>
    required: false
    default: both
  lang:
    description: Locale for relative times (en, es, or anything Intl understands)
    required: false
    default: en
  output-dir:
    description: Where to write the SVGs inside the workspace
    required: false
    default: .vinilo
  filename:
    description: Base name for the files, without extension
    required: false
    default: vinilo
  publish-to:
    description: >-
      Branch to commit the SVGs to. Leave empty to write the files without
      committing. Files already on that branch are preserved.
    required: false
    default: ""

outputs:
  paths:
    description: Generated files, comma separated
  track-count:
    description: How many tracks made it into the card

runs:
  using: node24
  main: dist/index.mjs
